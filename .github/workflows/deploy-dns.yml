name: Cut over DNS

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: aws-actions/configure-aws-credentials@v6.1.3
        with:
          role-to-assume: arn:aws:iam::015311074066:role/projects/easydread/easydread-ci
          role-session-name: easydread-dns-cutover
          aws-region: us-east-1

      - name: Read CloudFront domain
        id: hosting
        run: |
          distribution_domain_name=$(aws cloudformation describe-stacks \
            --stack-name easydread-hosting \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomainName'].OutputValue" \
            --output text)
          echo "distribution-domain-name=$distribution_domain_name" >> "$GITHUB_OUTPUT"

      - name: Deploy DNS stack
        id: deploy-dns
        continue-on-error: true
        run: |
          aws cloudformation deploy \
            --template-file infra/dns.yaml \
            --stack-name easydread-dns \
            --parameter-overrides \
              "DistributionDomainName=${{ steps.hosting.outputs.distribution-domain-name }}" \
            --region eu-west-1

      - name: Report DNS failure
        if: steps.deploy-dns.outcome == 'failure'
        run: |
          aws cloudformation describe-stack-events \
            --stack-name easydread-dns \
            --region eu-west-1 \
            --query "StackEvents[?ResourceStatusReason != null].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
            --output table
          exit 1
