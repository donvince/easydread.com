AWSTemplateFormatVersion: "2010-09-09"
Description: easydread.com Route 53 DNS records

# Deployed with the easydread profile (easydread-cli IAM user).
# Run scripts/cf-deploy-dns.sh to apply changes.

Parameters:
  HostedZoneId:
    Type: String
    Default: Z05099481R278MSYRMTGJ
  DistributionDomainName:
    Type: String
    Description: Domain name of the CloudFront distribution

Resources:

  EasydreadDnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:

        # Website — CloudFront
        - Name: easydread.com.
          Type: A
          AliasTarget:
            DNSName: !Ref DistributionDomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2

        - Name: easydread.com.
          Type: AAAA
          AliasTarget:
            DNSName: !Ref DistributionDomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2

        - Name: www.easydread.com.
          Type: A
          AliasTarget:
            DNSName: !Ref DistributionDomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2

        - Name: www.easydread.com.
          Type: AAAA
          AliasTarget:
            DNSName: !Ref DistributionDomainName
            EvaluateTargetHealth: false
            HostedZoneId: Z2FDTNDATAQYW2

        # FTP — pinned directly to original server IP so it remains
        # unaffected when the apex A record changes
        - Name: ftp.easydread.com.
          Type: A
          TTL: 300
          ResourceRecords:
            - 178.79.166.99

        # Email (ImprovMX) — unchanged
        - Name: easydread.com.
          Type: MX
          TTL: 300
          ResourceRecords:
            - 10 mx1.improvmx.com.
            - 20 mx2.improvmx.com.

        # SPF (ImprovMX) — unchanged
        - Name: easydread.com.
          Type: TXT
          TTL: 300
          ResourceRecords:
            - '"v=spf1 include:spf.improvmx.com ~all"'
